<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <defs>
    <linearGradient id="barGradient1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ff7a3d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff5200;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="barGradient2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ff9966;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff7a3d;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="300" fill="#14181f" rx="12"/>

  <!-- Chart container -->
  <rect x="20" y="20" width="360" height="260" fill="#1a1f2e" rx="8"/>

  <!-- Title -->
  <text x="30" y="45" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#f9fafb">
    Weekly Mileage
  </text>

  <!-- Y-axis labels -->
  <text x="45" y="80" font-family="Arial, sans-serif" font-size="10" fill="#9ca3af" text-anchor="end">50</text>
  <text x="45" y="130" font-family="Arial, sans-serif" font-size="10" fill="#9ca3af" text-anchor="end">35</text>
  <text x="45" y="180" font-family="Arial, sans-serif" font-size="10" fill="#9ca3af" text-anchor="end">20</text>
  <text x="45" y="230" font-family="Arial, sans-serif" font-size="10" fill="#9ca3af" text-anchor="end">5</text>

  <!-- Grid lines -->
  <line x1="55" y1="75" x2="370" y2="75" stroke="rgba(255, 82, 0, 0.1)" stroke-width="1"/>
  <line x1="55" y1="125" x2="370" y2="125" stroke="rgba(255, 82, 0, 0.1)" stroke-width="1"/>
  <line x1="55" y1="175" x2="370" y2="175" stroke="rgba(255, 82, 0, 0.1)" stroke-width="1"/>
  <line x1="55" y1="225" x2="370" y2="225" stroke="rgba(255, 82, 0, 0.1)" stroke-width="1"/>

  <!-- Bars -->
  <!-- Week 1 - 25 miles -->
  <rect x="70" y="150" width="35" height="75" fill="url(#barGradient1)" rx="4"/>

  <!-- Week 2 - 30 miles -->
  <rect x="120" y="135" width="35" height="90" fill="url(#barGradient1)" rx="4"/>

  <!-- Week 3 - 35 miles -->
  <rect x="170" y="120" width="35" height="105" fill="url(#barGradient2)" rx="4"/>

  <!-- Week 4 - 40 miles -->
  <rect x="220" y="105" width="35" height="120" fill="url(#barGradient2)" rx="4"/>

  <!-- Week 5 - 45 miles -->
  <rect x="270" y="90" width="35" height="135" fill="url(#barGradient2)" rx="4"/>

  <!-- Week 6 - 38 miles (current week - highlighted) -->
  <rect x="320" y="112" width="35" height="113" fill="url(#barGradient1)" rx="4" opacity="0.8"/>
  <rect x="320" y="112" width="35" height="113" fill="none" stroke="#ff5200" stroke-width="2" rx="4"/>

  <!-- X-axis labels -->
  <text x="87" y="245" font-family="Arial, sans-serif" font-size="10" fill="#9ca3af" text-anchor="middle">W1</text>
  <text x="137" y="245" font-family="Arial, sans-serif" font-size="10" fill="#9ca3af" text-anchor="middle">W2</text>
  <text x="187" y="245" font-family="Arial, sans-serif" font-size="10" fill="#9ca3af" text-anchor="middle">W3</text>
  <text x="237" y="245" font-family="Arial, sans-serif" font-size="10" fill="#9ca3af" text-anchor="middle">W4</text>
  <text x="287" y="245" font-family="Arial, sans-serif" font-size="10" fill="#9ca3af" text-anchor="middle">W5</text>
  <text x="337" y="245" font-family="Arial, sans-serif" font-size="10" fill="#ff7a3d" text-anchor="middle" font-weight="600">W6</text>

  <!-- Current week indicator -->
  <text x="370" y="117" font-family="Arial, sans-serif" font-size="9" fill="#ff5200" text-anchor="end" font-weight="600">38 mi</text>
</svg>
